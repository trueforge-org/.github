- name: "blocked"
  color: ffffff

- name: do-not-merge
  color: "ee0701"
  description: >-
    Categorises a PR that should not be merged in the current state.
- name: "incomplete-docs"
  color: B72175
  description: >-
    Categorises a PR for which the documentation has not been updated completely.
- name: keepalive
  color: "4D28C4"
  description: >-
    Categorises a PR or issue that should not be marked as stale.
- name: stale
  color: "D4C5F9"
  description: >-
    Categorises a PR or issue that has not been active for a specified time.
- name: "New-App"
  color: "fef2c0"
  description: >-
    Categorises a PR or issue that references a new App.
- name: "automerge"
  color: "fef2c0"
  description: >-
    Categorises a PR or issue that references a new App.

- name: "$$BOUNTY$$"
  color: "fef2c0"
  description: >-
    Issues that have a bounty attached

