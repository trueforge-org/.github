name: "Pre-commit consistency check"

on:
  workflow_call:
    inputs:
      modifiedFiles:
        required: true
        type: string

jobs:
  pre-commit-check:
    name: Run pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Run against changes
        uses: pre-commit/action@9b88afc9cd57fd75b655d5c71bd38146d07135fe # v2.0.3
        with:
          extra_args: --files ${{ inputs.modifiedFiles }}
